<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 688" font-family="sans-serif" font-size="12"><rect width="820" height="688" fill="#ffffff"/><text x="10" y="22" font-size="15" font-weight="bold" fill="#222">Ablation on real fog: what each part adds</text><rect x="10" y="30" width="12" height="12" fill="#1e88e5"/><text x="27" y="41" fill="#333" transform="translate(0,0)">SSIM</text><rect x="200" y="30" width="12" height="12" fill="#d32f2f"/><text x="27" y="41" fill="#333" transform="translate(190,0)">Edge F1</text><text x="292" y="75" text-anchor="end" fill="#333">Full pipeline (Balanced default)</text><rect x="300" y="52" width="380.7" height="15" fill="#1e88e5"/><text x="685.7" y="64" fill="#333">0.693</text><rect x="300" y="69" width="328.1" height="15" fill="#d32f2f"/><text x="633.1" y="81" fill="#333">0.597</text><text x="292" y="121" text-anchor="end" fill="#333">without histogram stretching</text><rect x="300" y="98" width="414.1" height="15" fill="#1e88e5"/><text x="719.1" y="110" fill="#333">0.754</text><rect x="300" y="115" width="352.5" height="15" fill="#d32f2f"/><text x="657.5" y="127" fill="#333">0.642</text><text x="292" y="167" text-anchor="end" fill="#333">without frequency-domain enhancement</text><rect x="300" y="144" width="401.9" height="15" fill="#1e88e5"/><text x="706.9" y="156" fill="#333">0.732</text><rect x="300" y="161" width="346.1" height="15" fill="#d32f2f"/><text x="651.1" y="173" fill="#333">0.630</text><text x="292" y="213" text-anchor="end" fill="#333">without adaptive smoothing + sharpening</text><rect x="300" y="190" width="379.4" height="15" fill="#1e88e5"/><text x="684.4" y="202" fill="#333">0.691</text><rect x="300" y="207" width="329.2" height="15" fill="#d32f2f"/><text x="634.2" y="219" fill="#333">0.599</text><text x="292" y="259" text-anchor="end" fill="#333">without all three course modules</text><rect x="300" y="236" width="440.0" height="15" fill="#1e88e5"/><text x="745.0" y="248" fill="#333">0.801</text><rect x="300" y="253" width="382.3" height="15" fill="#d32f2f"/><text x="687.3" y="265" fill="#333">0.696</text><text x="292" y="305" text-anchor="end" fill="#333">without the dark channel prior</text><rect x="300" y="282" width="368.7" height="15" fill="#1e88e5"/><text x="673.7" y="294" fill="#333">0.671</text><rect x="300" y="299" width="362.8" height="15" fill="#d32f2f"/><text x="667.8" y="311" fill="#333">0.660</text><text x="292" y="351" text-anchor="end" fill="#333">without colour balance</text><rect x="300" y="328" width="384.1" height="15" fill="#1e88e5"/><text x="689.1" y="340" fill="#333">0.699</text><rect x="300" y="345" width="330.9" height="15" fill="#d32f2f"/><text x="635.9" y="357" fill="#333">0.602</text><text x="292" y="397" text-anchor="end" fill="#333">without CLAHE</text><rect x="300" y="374" width="392.1" height="15" fill="#1e88e5"/><text x="697.1" y="386" fill="#333">0.714</text><rect x="300" y="391" width="341.4" height="15" fill="#d32f2f"/><text x="646.4" y="403" fill="#333">0.621</text><text x="292" y="443" text-anchor="end" fill="#333">without colour restoration</text><rect x="300" y="420" width="382.0" height="15" fill="#1e88e5"/><text x="687.0" y="432" fill="#333">0.695</text><rect x="300" y="437" width="329.1" height="15" fill="#d32f2f"/><text x="634.1" y="449" fill="#333">0.599</text><text x="292" y="489" text-anchor="end" fill="#333">without the adaptive dark channel</text><rect x="300" y="466" width="381.4" height="15" fill="#1e88e5"/><text x="686.4" y="478" fill="#333">0.694</text><rect x="300" y="483" width="329.1" height="15" fill="#d32f2f"/><text x="634.1" y="495" fill="#333">0.599</text><text x="292" y="535" text-anchor="end" fill="#333">without the three course modules and CLAHE</text><rect x="300" y="512" width="438.7" height="15" fill="#1e88e5"/><text x="743.7" y="524" fill="#333">0.799</text><rect x="300" y="529" width="335.3" height="15" fill="#d32f2f"/><text x="640.3" y="541" fill="#333">0.610</text><text x="292" y="581" text-anchor="end" fill="#333">without CLAHE, colour restoration and the adaptive dark channel</text><rect x="300" y="558" width="393.5" height="15" fill="#1e88e5"/><text x="698.5" y="570" fill="#333">0.716</text><rect x="300" y="575" width="342.7" height="15" fill="#d32f2f"/><text x="647.7" y="587" fill="#333">0.624</text><text x="292" y="627" text-anchor="end" fill="#333">without frequency, sharpening, smoothing and colour balance (Traffic preset)</text><rect x="300" y="604" width="402.9" height="15" fill="#1e88e5"/><text x="707.9" y="616" fill="#333">0.733</text><rect x="300" y="621" width="362.5" height="15" fill="#d32f2f"/><text x="667.5" y="633" fill="#333">0.660</text></svg>