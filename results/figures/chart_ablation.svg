<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 458" font-family="sans-serif" font-size="12"><rect width="820" height="458" fill="#ffffff"/><text x="10" y="22" font-size="15" font-weight="bold" fill="#222">Ablation on real fog: what each part adds</text><rect x="10" y="30" width="12" height="12" fill="#1e88e5"/><text x="27" y="41" fill="#333" transform="translate(0,0)">SSIM</text><rect x="200" y="30" width="12" height="12" fill="#d32f2f"/><text x="27" y="41" fill="#333" transform="translate(190,0)">Edge F1</text><text x="292" y="75" text-anchor="end" fill="#333">Full pipeline (Balanced default)</text><rect x="300" y="52" width="380.5" height="15" fill="#1e88e5"/><text x="685.5" y="64" fill="#333">0.692</text><rect x="300" y="69" width="327.2" height="15" fill="#d32f2f"/><text x="632.2" y="81" fill="#333">0.596</text><text x="292" y="121" text-anchor="end" fill="#333">without histogram stretching</text><rect x="300" y="98" width="414.2" height="15" fill="#1e88e5"/><text x="719.2" y="110" fill="#333">0.754</text><rect x="300" y="115" width="352.4" height="15" fill="#d32f2f"/><text x="657.4" y="127" fill="#333">0.641</text><text x="292" y="167" text-anchor="end" fill="#333">without frequency-domain enhancement</text><rect x="300" y="144" width="401.9" height="15" fill="#1e88e5"/><text x="706.9" y="156" fill="#333">0.731</text><rect x="300" y="161" width="346.3" height="15" fill="#d32f2f"/><text x="651.3" y="173" fill="#333">0.630</text><text x="292" y="213" text-anchor="end" fill="#333">without adaptive smoothing + sharpening</text><rect x="300" y="190" width="379.0" height="15" fill="#1e88e5"/><text x="684.0" y="202" fill="#333">0.690</text><rect x="300" y="207" width="328.0" height="15" fill="#d32f2f"/><text x="633.0" y="219" fill="#333">0.597</text><text x="292" y="259" text-anchor="end" fill="#333">without all three course modules</text><rect x="300" y="236" width="440.0" height="15" fill="#1e88e5"/><text x="745.0" y="248" fill="#333">0.801</text><rect x="300" y="253" width="382.3" height="15" fill="#d32f2f"/><text x="687.3" y="265" fill="#333">0.696</text><text x="292" y="305" text-anchor="end" fill="#333">without the dark channel prior</text><rect x="300" y="282" width="368.7" height="15" fill="#1e88e5"/><text x="673.7" y="294" fill="#333">0.671</text><rect x="300" y="299" width="362.9" height="15" fill="#d32f2f"/><text x="667.9" y="311" fill="#333">0.660</text><text x="292" y="351" text-anchor="end" fill="#333">without colour balance</text><rect x="300" y="328" width="384.0" height="15" fill="#1e88e5"/><text x="689.0" y="340" fill="#333">0.699</text><rect x="300" y="345" width="330.4" height="15" fill="#d32f2f"/><text x="635.4" y="357" fill="#333">0.601</text><text x="292" y="397" text-anchor="end" fill="#333">without frequency, sharpening, smoothing and colour balance (Traffic preset)</text><rect x="300" y="374" width="403.7" height="15" fill="#1e88e5"/><text x="708.7" y="386" fill="#333">0.735</text><rect x="300" y="391" width="365.1" height="15" fill="#d32f2f"/><text x="670.1" y="403" fill="#333">0.664</text></svg>