<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 504" font-family="sans-serif" font-size="12"><rect width="820" height="504" fill="#ffffff"/><text x="10" y="22" font-size="15" font-weight="bold" fill="#222">Methods against simple baselines, mean over 7 real fog scenes (higher is better)</text><rect x="10" y="30" width="12" height="12" fill="#1e88e5"/><text x="27" y="41" fill="#333" transform="translate(0,0)">SSIM</text><rect x="200" y="30" width="12" height="12" fill="#d32f2f"/><text x="27" y="41" fill="#333" transform="translate(190,0)">Edge F1</text><text x="292" y="75" text-anchor="end" fill="#333">Foggy input (no processing)</text><rect x="300" y="52" width="383.2" height="15" fill="#1e88e5"/><text x="688.2" y="64" fill="#333">0.674</text><rect x="300" y="69" width="88.3" height="15" fill="#d32f2f"/><text x="393.3" y="81" fill="#333">0.155</text><text x="292" y="121" text-anchor="end" fill="#333">Histogram stretching only</text><rect x="300" y="98" width="398.3" height="15" fill="#1e88e5"/><text x="703.3" y="110" fill="#333">0.701</text><rect x="300" y="115" width="364.9" height="15" fill="#d32f2f"/><text x="669.9" y="127" fill="#333">0.642</text><text x="292" y="167" text-anchor="end" fill="#333">Three course modules together</text><rect x="300" y="144" width="389.3" height="15" fill="#1e88e5"/><text x="694.3" y="156" fill="#333">0.685</text><rect x="300" y="161" width="376.0" height="15" fill="#d32f2f"/><text x="681.0" y="173" fill="#333">0.661</text><text x="292" y="213" text-anchor="end" fill="#333">Full pipeline (Balanced default)</text><rect x="300" y="190" width="393.6" height="15" fill="#1e88e5"/><text x="698.6" y="202" fill="#333">0.692</text><rect x="300" y="207" width="338.5" height="15" fill="#d32f2f"/><text x="643.5" y="219" fill="#333">0.596</text><text x="292" y="259" text-anchor="end" fill="#333">Histogram equalisation</text><rect x="300" y="236" width="359.0" height="15" fill="#1e88e5"/><text x="664.0" y="248" fill="#333">0.632</text><rect x="300" y="253" width="318.2" height="15" fill="#d32f2f"/><text x="623.2" y="265" fill="#333">0.560</text><text x="292" y="305" text-anchor="end" fill="#333">CLAHE only</text><rect x="300" y="282" width="415.8" height="15" fill="#1e88e5"/><text x="720.8" y="294" fill="#333">0.732</text><rect x="300" y="299" width="359.6" height="15" fill="#d32f2f"/><text x="664.6" y="311" fill="#333">0.633</text><text x="292" y="351" text-anchor="end" fill="#333">Gamma only (1.5)</text><rect x="300" y="328" width="330.5" height="15" fill="#1e88e5"/><text x="635.5" y="340" fill="#333">0.581</text><rect x="300" y="345" width="46.8" height="15" fill="#d32f2f"/><text x="351.8" y="357" fill="#333">0.082</text><text x="292" y="397" text-anchor="end" fill="#333">Plain unsharp mask</text><rect x="300" y="374" width="419.3" height="15" fill="#1e88e5"/><text x="724.3" y="386" fill="#333">0.738</text><rect x="300" y="391" width="258.7" height="15" fill="#d32f2f"/><text x="563.7" y="403" fill="#333">0.455</text><text x="292" y="443" text-anchor="end" fill="#333">Dark channel prior only</text><rect x="300" y="420" width="440.0" height="15" fill="#1e88e5"/><text x="745.0" y="432" fill="#333">0.774</text><rect x="300" y="437" width="262.8" height="15" fill="#d32f2f"/><text x="567.8" y="449" fill="#333">0.462</text></svg>